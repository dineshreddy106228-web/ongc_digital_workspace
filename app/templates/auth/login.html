{% extends "base.html" %}
{% block title %}Login – {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card auth-card-login">
        <div class="auth-header">
            <div class="auth-logo-wrap">
                <img
                    class="auth-logo-image"
                    src="{{ url_for('static', filename='images/ongc-corporate-chemistry-logo.png') }}"
                    alt="ONGC Corporate Chemistry emblem"
                >
            </div>
            <h1>Office of Head Corporate Chemistry</h1>
            <p class="auth-subtitle">Sign in to your workplace</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="off" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       autofocus maxlength="80" autocomplete="username"
                       placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       maxlength="128" autocomplete="current-password"
                       placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script nonce="{{ csp_nonce() }}">
/* The workspace menu remembers whether it was left open, which meant a new
   session inherited the last one's drawer. Reaching the login screen starts a
   fresh session, so the preference is cleared and the workspace opens closed. */
try { localStorage.removeItem('ongc-sidebar-flyout-open'); } catch (err) { /* private mode */ }
</script>
{% endblock %}
